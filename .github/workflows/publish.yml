name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for generating NPM provenance (SLSA security standard)

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x # Use Node 22+ which includes npm CLI with native OIDC support
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm' # Enable dependency caching to speed up builds

      - name: Install Dependencies
        run: npm ci

      - name: Build Packages
        run: npm run build

      - name: Publish to NPM
        run: npm publish --workspaces --access public --provenance
